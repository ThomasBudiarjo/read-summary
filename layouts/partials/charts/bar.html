{{- $chart := .chart -}}
<div class="read-chart__bar-list" role="list" aria-label="{{ $chart.plot_label }}">
  {{- range $chart.items }}
    {{- $width := div (mul .value 100) $chart.scale.max -}}
    <div class="read-chart__bar-row{{ if .emphasis }} is-emphasized{{ end }}" role="listitem">
      <span class="read-chart__bar-label">{{ .label }}</span>
      <div class="read-chart__track" aria-hidden="true"><span class="read-chart__fill" style="width: {{ $width }}%"></span></div>
      <strong class="read-chart__value">{{ .value }}</strong>
    </div>
  {{- end }}
</div>
<p class="read-chart__axis-note">{{ $chart.scale.label }}</p>
