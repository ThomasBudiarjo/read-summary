{{- $chart := .chart -}}
<div class="read-chart__arc-groups" aria-label="{{ $chart.plot_label }}">
  {{- range $chart.groups }}
    <section class="read-chart__arc-group">
      <h5>{{ .label }}</h5>
      <div class="read-chart__arc-row">
        {{- range .items }}
          <div class="read-chart__arc-item">
            <div class="read-chart__arc is-{{ .potential }} is-uncertainty-{{ .uncertainty }}" aria-hidden="true">
              <span class="read-chart__arc-potential"></span>
            </div>
            <p>{{ .label }}</p>
          </div>
        {{- end }}
      </div>
    </section>
  {{- end }}
</div>
